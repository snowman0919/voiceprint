server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ponytail: 'wasm-unsafe-eval' (CSP3) allows WebAssembly.instantiate without
  # 'unsafe-eval' (which would also permit eval()). ORT wasm backend needs this.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "microphone=(self)" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # ponytail: nginx drops ALL server add_header when a location adds its own.
  # CORP is required on subresources under COEP require-corp; repeat it (+nosniff)
  # in every location that sets Cache-Control, or worker/static fetches 403.
  location /wasm/ {
    types { application/wasm wasm; }
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ORT wasm assets: .mjs must be JS MIME or browser rejects the ES module import
  # ("Failed to fetch" under X-Content-Type-Options: nosniff). .wasm is binary.
  location /ort/ {
    types {
      application/wasm wasm;
      text/javascript mjs js;
    }
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Next.js bundled JS modules (incl. ort.webgpu.bundle.min.*.mjs) under
  # /_next/static/. Without explicit MIME, nginx defaults to octet-stream and
  # X-Content-Type-Options: nosniff rejects the ES module import.
  location /_next/static/ {
    types {
      text/javascript mjs js;
      application/javascript js;
      application/wasm wasm;
      text/css css;
      application/json json;
    }
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # A browser must revalidate this small bootstrap file to receive a new cache name.
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The results service stores scalar measurement summaries only. Keep the
  # upstream dynamic so a static-only `docker run` can still serve the UI.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $results_api http://results-api:8081;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $results_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
