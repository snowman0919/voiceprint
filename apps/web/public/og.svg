<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Voiceprint</title>
  <desc id="description">온디바이스 음성 분석</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="80" y="96" width="12" height="438" fill="#2b7a78"/>
  <text x="136" y="248" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-5">Voiceprint</text>
  <text x="140" y="342" fill="#364152" font-family="Arial, Helvetica, sans-serif" font-size="34">목소리의 음향적 특징을 이 기기에서 분석합니다.</text>
  <text x="140" y="414" fill="#52606d" font-family="Arial, Helvetica, sans-serif" font-size="28">음성은 이 기기를 벗어나지 않습니다.</text>
