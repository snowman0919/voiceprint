name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - run: cargo install wasm-pack --locked
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project ml --locked
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: make format-check lint typecheck test-wasm benchmark-dsp-compile test-python test-web test-e2e build
      - run: docker build --tag voiceprint:ci .
