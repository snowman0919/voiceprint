[project]
name = "voiceprint-ml"
version = "0.1.0"
description = "Reproducible training and validation for Voiceprint"
requires-python = ">=3.11"
dependencies = [
  "torch==2.7.0",
  "torchaudio==2.7.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "praat-parselmouth>=0.4.5",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "tensorboard>=2.18",
  "kaggle>=1.7",
  "datasets>=5.0.0",
  "soundfile>=0.14.0",
]

[tool.uv]
package = false
